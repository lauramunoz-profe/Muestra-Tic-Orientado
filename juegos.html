<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafíos Robótica por Grupos · 5to TIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070b14;
    --surface:#101830;
    --surface-2:#151f3d;
    --line:rgba(148,163,209,0.16);
    --text:#e8edfb;
    --muted:#8b96b8;
    --teal:#5eead4;
    --indigo:#8b8ef2;
    --amber:#f6c177;
    --rose:#f43f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}

  /* ---------- Nav ---------- */
  nav{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:1.2rem;
    padding:1rem clamp(1.2rem,4vw,3rem);
    background:rgba(7,11,20,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-size:1.05rem; font-weight:700; cursor:pointer;}
  .brand span{color:var(--teal);}
  .nav-links{display:flex; gap:0.8rem; font-size:.92rem;}
  .nav-links a{
    color:var(--muted); text-decoration:none; padding:.4rem .8rem; border-radius:6px;
    border:1px solid var(--line); transition: all .2s;
  }
  .nav-links a:hover{ color:var(--teal); border-color:var(--teal); }

  main{ max-width:920px; margin:0 auto; padding:2.5rem 1.4rem; }

  /* Selector de Grupos */
  .group-controls {
    display: flex; flex-direction: column; align-items: center; gap: 0.8rem; margin-bottom: 2rem;
  }
  .group-tabs {
    display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center;
  }
  .tab-btn {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 0.6rem 1.1rem; border-radius: 10px; font-weight: 600; cursor: pointer;
    font-family: inherit; font-size: 0.9rem; transition: all 0.2s;
  }
  .tab-btn:hover, .tab-btn.active {
    background: var(--teal); color: var(--ink); border-color: var(--teal);
  }
  .tab-btn.hidden {
    display: none;
  }
  .btn-show-all {
    background: transparent; border: 1px dashed var(--line); color: var(--muted);
    padding: 0.35rem 0.85rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .btn-show-all:hover {
    color: var(--teal); border-color: var(--teal);
  }

  /* Cuadro del Juego */
  .game-frame {
    background: var(--surface); border: 2px solid var(--teal); border-radius: 20px;
    padding: 2rem; box-shadow: 0 0 35px rgba(94, 234, 212, 0.15); position: relative;
  }

  .game-header { margin-bottom: 1.5rem; text-align: center; }
  .game-header h2 { font-size: 1.6rem; color: var(--teal); margin-bottom: 0.3rem; }
  .game-header p { font-size: 0.9rem; color: var(--muted); }

  .game-status-bar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem;
    background: var(--surface-2); padding: 0.8rem 1.2rem; border-radius: 12px;
    margin-bottom: 1.5rem; border: 1px solid var(--line);
  }

  .timer-card {
    display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(246, 193, 119, 0.12);
    border: 1px solid rgba(246, 193, 119, 0.35); padding: 0.4rem 0.9rem; border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; color: var(--amber); font-weight: 700;
  }

  .track {
    display: flex; gap: 6px; justify-content: space-between; align-items: center;
    background: rgba(7, 11, 20, 0.7); padding: 1rem 0.8rem; border-radius: 14px;
    margin-bottom: 1.5rem; border: 1px solid var(--line); overflow-x: auto;
  }
  .track-step {
    flex: 1; height: 44px; min-width: 34px; border-radius: 8px; background: var(--surface-2);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; transition: all 0.3s;
  }
  .track-step.active { border-color: var(--teal); background: rgba(94, 234, 212, 0.18); transform: scale(1.05); }
  .track-step.passed { border-color: rgba(94, 234, 212, 0.4); color: var(--teal); font-size: 0.95rem; }

  .quiz-card { background: var(--surface-2); padding: 1.5rem; border-radius: 14px; border: 1px solid var(--line); }
  .quiz-question { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
  .quiz-options { display: flex; flex-direction: column; gap: 0.65rem; }
  .quiz-opt {
    padding: 0.85rem 1rem; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--line); color: var(--text); font-family: inherit;
    font-size: 0.92rem; text-align: left; cursor: pointer; transition: all 0.2s;
  }
  .quiz-opt:hover { border-color: var(--teal); background: rgba(94, 234, 212, 0.08); }
  .quiz-opt:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-restart {
    display: inline-block; margin-top: 1.2rem; padding: 0.75rem 1.5rem;
    background: var(--teal); color: var(--ink); font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
  }

  .game-msg { margin-top: 1rem; font-weight: 600; text-align: center; min-height: 24px; font-size: 0.92rem; }
  .game-msg.error { color: var(--rose); }
  .game-msg.success { color: var(--teal); }

  footer{ text-align:center; color:var(--muted); font-size:.82rem; padding:2rem 1rem; margin-top:3rem; }
</style>
</head>
<body>

  <nav>
    <div class="brand" onclick="window.location.href='index.html'">5to<span>TIC</span></div>
    <div class="nav-links">
      <a href="index.html">← Volver al inicio</a>
    </div>
  </nav>

  <main>
    <div class="group-controls">
      <div class="group-tabs" id="group-tabs">
        <button class="tab-btn" data-group="1" onclick="selectGroup(1)">Grupo 1: LUZ</button>
        <button class="tab-btn" data-group="2" onclick="selectGroup(2)">Grupo 2: ALARMAS</button>
        <button class="tab-btn" data-group="3" onclick="selectGroup(3)">Grupo 3: TEMPERATURA</button>
        <button class="tab-btn" data-group="4" onclick="selectGroup(4)">Grupo 4: HUMEDAD</button>
        <button class="tab-btn" data-group="5" onclick="selectGroup(5)">Grupo 5: MOVIMIENTO</button>
        <button class="tab-btn" data-group="6" onclick="selectGroup(6)">Grupo 6: PANTALLA LED</button>
      </div>
      <button class="btn-show-all" id="btn-show-all" onclick="showAllGroups()" style="display:none;">
        Cambiar de grupo ▾
      </button>
    </div>

    <div class="game-frame">
      <div class="game-header">
        <h2 id="game-title">Desafío Grupo 1 - Sensor de Luz</h2>
        <p id="game-desc">Integrantes...</p>
      </div>

      <div class="game-status-bar">
        <div>
          <span style="font-size:0.8rem; color:var(--muted);">ESTADO: </span>
          <b id="game-status-text" style="color:var(--teal);">EN CURSO</b>
        </div>
        <div class="timer-card">
          <span>⏱️</span>
          <span id="game-timer">15:00</span>
        </div>
      </div>

      <div class="track" id="game-track"></div>

      <div class="quiz-card" id="quiz-card">
        <div class="quiz-question" id="quiz-question">Cargando pregunta...</div>
        <div class="quiz-options" id="quiz-options"></div>
        <div class="game-msg" id="game-msg"></div>
      </div>
    </div>
  </main>

  <footer>5to TIC Orientado · Muestra Anual 2026</footer>

<script>
  const groupData = {
    1: {
      title: "Desafío Grupo 1 - Sensor de Luz",
      desc: "Integrantes: Tobias Benitez, Moira Bogado, Martina Lopez, Bianca Lozano, Magali Romero, Kiara Toledo",
      questions: [
        { q: "¿Qué hace un robot seguidor de línea si le quitás la luz por completo?", options: ["Sigue andando", "No ve el camino y se pierde", "Se queda quieto"], correct: 1 },
        { q: "¿Cómo se llama técnicamente el componente en forma de zigzag que usan los robots para detectar la luz?", options: ["LED", "LDR (fotorresistencia)", "Motor DC"], correct: 1 },
        { q: "¿Por qué se dice que el sensor de luz es un dispositivo de entrada?", options: ["Recibe información del exterior al robot", "Hace mover las ruedas del robot", "Emite sonido cuando alguien se acerca"], correct: 0 },
        { q: "Cuando la intensidad de la luz aumenta y le pega al sensor LDR, ¿qué le ocurre a su resistencia eléctrica?", options: ["Aumenta y bloquea la corriente", "No le pasa nada", "Baja y deja pasar más corriente"], correct: 2 },
        { q: "¿Cuál de estos colores refleja más luz hacia el sensor?", options: ["Celeste", "Amarillo", "Blanco"], correct: 2 },
        { q: "¿Qué pasa con la resistencia del LDR en la oscuridad?", options: ["Se vuelve más alta", "Vuelve a 0 (cero)", "Explota el sensor"], correct: 0 },
        { q: "Si conectamos mal la polaridad o invertimos los pines de una LDR común, ¿qué pasa?", options: ["Explota", "Funciona igual", "Emite una luz láser"], correct: 1 },
        { q: "¿Cómo se comporta una LDR frente a la luz?", options: ["Cambia su resistencia", "Es un panel solar", "Cambia de color"], correct: 0 },
        { q: "¿Qué se usa para ignorar la luz ambiental estática de una habitación?", options: ["Pulsos infrarrojos modulados", "Inversión de polaridad", "Modulación lineal"], correct: 0 },
        { q: "¿Cuántos valores entrega un ADC de 10 bits (como en Arduino)?", options: ["1024", "256", "4096"], correct: 0 }
      ]
    },
    2: {
      title: "Desafío Grupo 2 - Sensor ALARMAS",
      desc: "Integrantes: Melisa Yujra, Juan Quispe, Angelo Cipe, Matias Huayta, Ayelen Quispe, Alexander Riera, Melody Vergaray, Nahuel Ortega",
      questions: [
        { q: "¿Qué tipo de energía utiliza un sensor?", options: ["Eléctrica", "Solar solamente", "Sonora"], correct: 0 },
        { q: "¿Qué hace el sensor cuando detecta movimiento?", options: ["Envía una señal", "Se rompe", "Se apaga"], correct: 0 },
        { q: "¿Qué significa PIR?", options: ["Infrarrojo pasivo", "Programa inteligente", "Luz automática"], correct: 0 },
        { q: "¿Dónde se coloca normalmente?", options: ["En paredes o techos", "Dentro del agua", "Debajo de la tierra"], correct: 0 },
        { q: "¿Qué detecta un sensor infrarrojo?", options: ["Cambios de calor", "Colores", "Sabores"], correct: 0 },
        { q: "¿Puede funcionar conectado a una alarma?", options: ["Sí", "No", "Nunca"], correct: 0 },
        { q: "¿Cuál es una ventaja del sensor?", options: ["Aumenta la seguridad", "Produce comida", "Hace llamadas"], correct: 0 },
        { q: "¿Qué tipo de sensor es más común en las alarmas de movimiento?", options: ["Sensor PIR", "Sensor de sonido", "Sensor de agua"], correct: 0 },
        { q: "¿Qué aparato puede trabajar junto con un sensor de movimiento?", options: ["Una cámara de seguridad", "Una licuadora", "Una radio"], correct: 0 },
        { q: "¿Qué puede afectar el funcionamiento de un sensor de movimiento?", options: ["La temperatura del ambiente", "El color de las paredes", "El tamaño de las puertas"], correct: 0 }
      ]
    },
    3: {
      title: "Desafío Grupo 3 - Sensor de Temperatura",
      desc: "Integrantes: Micaela Onofre, Matias Fernandez, Andrea Guarachi, Angelina Gonzales, Jennifer Mayta, Cristina Salazar, Damian Vega",
      questions: [
        { q: "¿Qué es un sensor de temperatura y por qué lo elegimos para este proyecto?", options: ["Es una herramienta manual que sirve para medir la humedad del aire.", "Es un dispositivo electrónico que mide el calor o el frío y lo convierte en una señal eléctrica, elegido para obtener datos precisos y en tiempo real del terreno.", "Es un regulador térmico que calienta el suelo automáticamente cuando hay heladas.", "Es un medidor químico que analiza los nutrientes de la tierra."], correct: 1 },
        { q: "¿Para qué sirve principalmente el sensor de temperatura en el suelo?", options: ["Para detectar metales y minerales enterrados a gran profundidad.", "Para monitorear y registrar las variaciones térmicas del terreno y tomar decisiones sobre su manejo.", "Para evitar que el agua subterránea se evapore en verano.", "Para medir el peso y la compactación de la tierra."], correct: 1 },
        { q: "¿Cuál es la función de la espaciadora durante la instalación del sensor?", options: ["Aumentar la potencia de la batería del dispositivo.", "Mantener el sensor a una profundidad exacta y evitar el contacto con elementos que alteren la medición o lo dañen.", "Filtrar el agua subterránea para que no toque los cables.", "Enviar los datos por Wi-Fi a una computadora."], correct: 1 },
        { q: "¿Cuál de los siguientes es un beneficio clave de utilizar este sensor?", options: ["No necesita ningún tipo de mantenimiento ni calibración jamás.", "Cambia la temperatura del suelo si detecta peligro para las plantas.", "Permite obtener mediciones continuas y precisas de forma automática, detectando anomalías a tiempo.", "Funciona sin electricidad ni baterías de ningún tipo."], correct: 2 },
        { q: "¿Qué ocurre si la temperatura del terreno supera los límites máximos o mínimos que el sensor puede detectar?", options: ["El sensor se apaga automáticamente y guarda los datos en la nube.", "Comienza a registrar valores incorrectos, pierde precisión o deja de detectar los cambios térmicos.", "Activa un sistema de enfriamiento interno para protegerse.", "Duplica su velocidad de lectura para compensar el error."], correct: 1 },
        { q: "En caso de sobrecalentamiento extremo, ¿qué daños puede sufrir el sensor?", options: ["Solo se descarga la batería más rápido, pero el equipo queda intacto.", "Se bloquea la pantalla hasta que vuelve a hacer frío.", "Se daña su elemento sensible y sus aislantes, pudiendo deformarse o destruirse de forma permanente.", "Pierde la conexión con la espaciadora."], correct: 2 },
        { q: "¿Cuál es la vida útil estimada de un sensor de temperatura en condiciones normales?", options: ["De 6 meses a 1 año.", "De 1 a 2 años.", "De 5 a 10 años (y hasta 15 años en modelos industriales bien mantenidos).", "Más de 50 años sin desgaste."], correct: 2 },
        { q: "¿Qué fenómeno ambiental del suelo puede generar pequeñas cantidades de calor local y alterar la medición?", options: ["La caída de hojas secas en la superficie.", "La actividad biológica y descomposición de materia orgánica por microorganismos.", "El viento fuerte sobre el terreno.", "La presencia de piedras grandes cerca de la espaciadora."], correct: 1 },
        { q: "¿A qué se le llama \"deriva de calibración\" en las desventajas técnicas del sensor?", options: ["A que el sensor se mueve de lugar por el agua subterránea.", "A que el dispositivo tarda mucho en encenderse.", "A que, con el paso del tiempo, pierde precisión y necesita ser recalibrado.", "A que la señal se corta cuando hay nubes."], correct: 2 },
        { q: "¿Qué desventaja ambiental relacionada con la estructura física del terreno puede dañar el dispositivo?", options: ["La presión, los movimientos y la compactación del suelo.", "La sombra de los árboles cercanos.", "La falta de oxígeno a gran profundidad.", "El crecimiento de raíces superficiales de césped."], correct: 0 }
      ]
    },
    4: {
      title: "Desafío Grupo 4 - Sensor de Humedad",
      desc: "Integrantes: Dylan Tapia, Santiago Juarez, Owen Rojas, Tiago Santillan, Axel Juaniquina, Ezequiel Torrejon",
      questions: [
        { q: "¿Qué sensor mide la humedad en el suelo para sistemas de riego?", options: ["Higrómetro de suelo", "LDR", "Sensor PIR"], correct: 0 },
        { q: "¿Qué se activa cuando el suelo está seco?", options: ["Una bomba de agua o LED indicador", "Un buzzer continuo", "El sensor de temperatura"], correct: 0 }
      ]
    },
    5: {
      title: "Desafío Grupo 5 - Sensor De Movimiento",
      desc: "Integrantes: Alejandra Berrios, Nuriel Nogales, Ayelen Oropeza",
      questions: [
        { q: "Si paso adelante del sensor, ¿qué puede pasar?", options: ["Se enciende el LED.", "El sensor deja de funcionar.", "Desconecta el circuito."], correct: 0 },
        { q: "¿El sensor puede detectar cuando alguien se acerca?", options: ["Sí, puede detectar movimiento.", "Detecta únicamente los sonidos.", "Funciona solamente de noche."], correct: 0 },
        { q: "¿Qué pasa si nadie se mueve frente al sensor?", options: ["El sistema queda inactivo.", "El sensor activa una alarma.", "El LED queda encendido."], correct: 0 },
        { q: "¿Cuál es la pieza más importante de nuestro proyecto?", options: ["El LED.", "La persona que está mirando.", "Arduino UNO"], correct: 2 },
        { q: "¿Para qué sirve el sensor PIR?", options: ["Para detectar movimiento o presencia.", "Detectar sonidos.", "Captar imágenes del ambiente."], correct: 0 },
        { q: "¿Dónde podríamos usar este proyecto en la vida real?", options: ["En alarmas.", "En luces automáticas.", "En sistemas de seguridad.", "Todas las anteriores."], correct: 3 }
      ]
    },
    6: {
      title: "Desafío Grupo 6 - Pantalla LED",
      desc: "Integrantes: Serena Figueroa, Damaris Vargas, Julieta Zambrana",
      questions: [
        { q: "¿Qué protocolo de comunicación se usa comúnmente con pantallas LCD para usar solo 2 pines?", options: ["I2C", "SPI", "Bluetooth"], correct: 0 },
        { q: "¿Qué componente ajusta el contraste de un display 16x2?", options: ["Potenciómetro", "Capacitor", "Diodo Zener"], correct: 0 }
      ]
    }
  };

  let activeGroup = 1;
  let currentStep = 0;
  let totalSteps = 10;
  let timerInterval = null;
  let timeLeft = 15 * 60;
  let isTransitioning = false;

  // Selecciona el grupo, oculta los demás botones y arranca el juego
  function selectGroup(num) {
    activeGroup = num;
    
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      const btnGroup = parseInt(btn.dataset.group);
      const isSelected = btnGroup === num;
      btn.classList.toggle('active', isSelected);
      btn.classList.toggle('hidden', !isSelected);
    });

    document.getElementById('btn-show-all').style.display = 'inline-block';
    window.history.replaceState({}, '', `?grupo=${num}`);
    initGame();
  }

  // Vuelve a mostrar todos los grupos si quieren elegir otro
  function showAllGroups() {
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.classList.remove('hidden');
    });
    document.getElementById('btn-show-all').style.display = 'none';
  }

  function initGame() {
    const data = groupData[activeGroup];
    currentStep = 0;
    totalSteps = data.questions.length;
    timeLeft = 15 * 60;
    isTransitioning = false;

    document.getElementById('game-title').textContent = data.title;
    document.getElementById('game-desc').textContent = data.desc;
    
    document.getElementById('game-status-text').textContent = "EN CURSO";
    document.getElementById('game-status-text').style.color = "var(--teal)";
    
    document.getElementById('quiz-card').innerHTML = `
      <div class="quiz-question" id="quiz-question"></div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="game-msg" id="game-msg"></div>
    `;
    
    renderTrack();
    loadQuestion();
    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        document.getElementById('game-status-text').textContent = "¡TIEMPO AGOTADO!";
        document.getElementById('game-status-text').style.color = "var(--rose)";
        document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const sec = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('game-timer').textContent = `${min}:${sec}`;
  }

  function renderTrack() {
    const track = document.getElementById('game-track');
    track.innerHTML = '';
    for (let i = 0; i < totalSteps; i++) {
      const step = document.createElement('div');
      step.className = `track-step ${i === currentStep ? 'active' : (i < currentStep ? 'passed' : '')}`;
      if (i === totalSteps - 1) {
        step.innerHTML = i === currentStep ? '🤖' : '🏁';
      } else {
        step.innerHTML = i === currentStep ? '🤖' : (i < currentStep ? '✓' : '');
      }
      track.appendChild(step);
    }
  }

  function loadQuestion() {
    isTransitioning = false;
    const data = groupData[activeGroup];
    const currentQ = data.questions[currentStep];
    
    document.getElementById('quiz-question').textContent = `Pregunta ${currentStep + 1} de ${totalSteps}: ${currentQ.q}`;
    const optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';

    // Mezclar opciones aleatoriamente
    const shuffledOptions = currentQ.options
      .map((text, idx) => ({ text, isCorrect: idx === currentQ.correct }))
      .sort(() => Math.random() - 0.5);

    shuffledOptions.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = opt.text;
      btn.addEventListener('click', () => checkAnswer(opt.isCorrect));
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(isCorrect) {
    if (isTransitioning || timeLeft <= 0) return;
    const msgEl = document.getElementById('game-msg');
    
    if (isCorrect) {
      isTransitioning = true;
      msgEl.className = 'game-msg success';
      msgEl.textContent = '¡Correcto! El robot avanza.';
      currentStep++;
      
      if (currentStep >= totalSteps) {
        renderTrack();
        clearInterval(timerInterval);
        document.getElementById('game-status-text').textContent = '¡DESAFÍO COMPLETADO!';
        document.getElementById('quiz-card').innerHTML = `
          <div style="text-align:center;">
            <div class="quiz-question" style="color:var(--teal);">🎉 ¡Felicitaciones! Completaste las ${totalSteps} preguntas del grupo.</div>
            <button class="btn-restart" onclick="initGame()">Jugar de nuevo 🔄</button>
          </div>
        `;
        return;
      }
      
      renderTrack();
      setTimeout(() => {
        if (document.getElementById('game-msg')) {
          msgEl.textContent = '';
          loadQuestion();
        }
      }, 700);
    } else {
      msgEl.className = 'game-msg error';
      msgEl.textContent = 'Respuesta incorrecta. Volvé a intentarlo.';
    }
  }

  // Arranque inicial según el parámetro ?grupo=X de la URL
  const urlParams = new URLSearchParams(window.location.search);
  const groupParam = parseInt(urlParams.get('grupo'));
  if (groupParam && groupParam >= 1 && groupParam <= 6) {
    selectGroup(groupParam);
  } else {
    // Si entran directo sin elegir grupo en index.html, mostramos todos los botones y cargamos el 1
    document.querySelector('.tab-btn[data-group="1"]').classList.add('active');
    initGame();
  }
</script>
</body>
</html>
